<!DOCTYPE html>
<html>
<head>
  <title>Agendar Cita</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">
  <h2>Agendar Cita</h2>

  <input type="text" id="paciente" placeholder="Nombre del paciente">
  <input type="date" id="fecha">
  <input type="time" id="hora">

  <button class="save-btn" onclick="guardar()">Guardar Cita</button>
  <button class="secondary-btn" onclick="location.href='citas.html'">Ver Citas</button>
</div>

<script>
function guardar(){
  let nombre = document.getElementById("paciente").value;
  let fecha = document.getElementById("fecha").value;
  let hora = document.getElementById("hora").value;

  if(nombre === "" || fecha === "" || hora === ""){
    alert("Completa todos los campos.");
    return;
  }

  fetch("https://script.google.com/macros/s/AKfycbxmUWO0-DpdMbBB8uRq_iC4Ej8ZwjVQ5ABzZW71KYpZCDhnSfcIb-U4s_n9dSLxmnTmFA/exec", { // reemplaza con tu URL de implementación /exec
    method: "POST",
    body: JSON.stringify({nombre, fecha, hora, asistencia: "", puntualidad: ""}),
  })
  .then(response => response.json())
  .then(data => {
    if(data.result && data.result === "success"){
      alert("Cita guardada.");
      // Recargar página para limpiar formulario
      document.getElementById("paciente").value = "";
      document.getElementById("fecha").value = "";
      document.getElementById("hora").value = "";
    } else {
      alert("Error: " + (data.message || JSON.stringify(data)));
    }
  })
  .catch(error => alert("Error de conexión: " + error));
}
</script>

</body>
</html>
